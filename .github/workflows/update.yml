name: Update Dashboard

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Generate dashboard
        run: python scripts/gen_mobile.py
      - name: Copy to root for Pages
        run: cp mobile/index.html index.html
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html mobile/index.html mobile/funds.json
          git diff --staged --quiet || git commit -m "Auto-update dashboard $(date -u '+%Y-%m-%d')"
          git push
